<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review &amp; annotate</title>
<style>
  :root{
    --ground:#f5f7f7;--surface:#fff;--surface-2:#eef2f2;--ink:#131a1c;--ink-2:#47555a;--ink-3:#6d7c81;
    --border:#dde4e4;--border-strong:#c6d0d0;--accent:#0d6b6a;--accent-soft:#e2efee;--amber-line:#d8961f;
    --green:#1c7a44;--green-soft:#e0f0e6;--red:#b23a2c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --shadow:0 1px 2px rgba(19,26,28,.05),0 4px 16px rgba(19,26,28,.05);
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0d1315;--surface:#141c1f;--surface-2:#1b262a;--ink:#e7eded;--ink-2:#a3b1b4;--ink-3:#74858a;
    --border:#26333a;--border-strong:#34454d;--accent:#3fb5b0;--accent-soft:#123232;--amber-line:#b98424;
    --green:#4cbd77;--green-soft:#12291b;--red:#e0776a;--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.32);
  }}
  :root[data-theme="dark"]{--ground:#0d1315;--surface:#141c1f;--surface-2:#1b262a;--ink:#e7eded;--ink-2:#a3b1b4;--ink-3:#74858a;--border:#26333a;--border-strong:#34454d;--accent:#3fb5b0;--accent-soft:#123232;--amber-line:#b98424;--green:#4cbd77;--green-soft:#12291b;--red:#e0776a;--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 22px rgba(0,0,0,.32);}
  :root[data-theme="light"]{--ground:#f5f7f7;--surface:#fff;--surface-2:#eef2f2;--ink:#131a1c;--ink-2:#47555a;--ink-3:#6d7c81;--border:#dde4e4;--border-strong:#c6d0d0;--accent:#0d6b6a;--accent-soft:#e2efee;--amber-line:#d8961f;--green:#1c7a44;--green-soft:#e0f0e6;--red:#b23a2c;--shadow:0 1px 2px rgba(19,26,28,.05),0 4px 16px rgba(19,26,28,.05);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:52rem;margin:0 auto;padding:2.2rem 1.4rem 7rem}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 .5rem}
  h1{font-size:1.5rem;line-height:1.24;margin:0 0 .3rem;letter-spacing:-.015em;font-weight:680;text-wrap:balance}
  .sub{color:var(--ink-3);font-size:.84rem;font-family:var(--mono);margin:0 0 1rem}
  .hint{margin:1rem 0 1.4rem;padding:.7rem .9rem;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.86rem}
  .doc{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:.5rem 0;counter-reset:ln}
  /* Line number via ::before so it never enters the block's textContent — anchor
     offsets/prefix/suffix stay accurate. */
  .line{counter-increment:ln;position:relative;padding:.05rem 1.1rem .05rem 3.4rem;white-space:pre-wrap;word-break:break-word}
  .line::before{content:counter(ln);position:absolute;left:0;width:2.6rem;text-align:right;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);user-select:none}
  .line.blank{min-height:.9rem}
  .line.blank::before{content:""}
  .line.h{font-weight:680;font-size:1.05rem}
  .general{margin-top:1.3rem}
  .general label{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  textarea{width:100%;min-height:3rem;resize:vertical;margin-top:.4rem;font-family:var(--sans);font-size:.92rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;line-height:1.45}
  textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border)}
  .bar-inner{max-width:52rem;margin:0 auto;padding:.85rem 1.4rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
  .summary{flex:1;min-width:10rem;font-size:.84rem;color:var(--ink-2)}
  .btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;padding:.55rem 1.1rem;border-radius:9px;cursor:pointer}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.cancel{color:var(--ink-2)}.btn.discuss{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .done{position:fixed;inset:0;background:var(--ground);display:none;place-items:center;padding:2rem;text-align:center;z-index:2147483600}
  .done.show{display:grid}
  .done .ic{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;margin:0 auto 1rem;font-size:1.6rem;background:var(--green-soft);color:var(--green)}
  .done h2{margin:0 0 .5rem}.done p{color:var(--ink-2);margin:0;max-width:28rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="hint" id="hint"></div>
  <div class="doc" data-annotate id="doc"></div>
  <div class="general" id="generalWrap">
    <label for="generalNote">Overall note (optional)</label>
    <textarea id="generalNote"></textarea>
  </div>
</div>
<div class="bar"><div class="bar-inner"><div class="summary" id="summary">Select any text to comment.</div><span id="footer"></span></div></div>
<div class="done" id="done"><div><div class="ic" id="doneIc">✓</div><h2 id="doneTitle">Submitted</h2><p id="doneMsg"></p></div></div>

<script>
  const _N = "__NONCE__";
  const NONCE = /^[A-Za-z0-9_-]{10,}$/.test(_N) ? _N : (new URLSearchParams(location.search).get('n') || '');
  const D = (__PAGE_DATA__) || {};
  const $ = id => document.getElementById(id);

  $('eyebrow').textContent = D.eyebrow || 'Review · highlight & comment';
  $('title').textContent = D.title || 'Document review';
  if (D.subtitle) $('subtitle').textContent = D.subtitle; else $('subtitle').remove();
  $('hint').textContent = D.instruction || 'Select any span of text to attach a comment. Add an overall note if you like, then submit.';
  if (D.hideGeneralNote) $('generalWrap').remove(); else $('generalNote').placeholder = D.generalNotePlaceholder || 'Overall verdict, themes, anything not tied to one span…';

  // Render blocks: explicit D.blocks[], else split D.text on newlines. Block index = data-anchor bN.
  const blocks = D.blocks ? D.blocks.map(b => (typeof b === 'string' ? { text: b } : b)) : String(D.text || '').split('\n').map(t => ({ text: t }));
  const doc = $('doc');
  blocks.forEach((b) => {
    const line = document.createElement('div');
    line.className = 'line' + (b.text.trim() ? '' : ' blank') + (b.heading ? ' h' : '');
    line.textContent = b.text || '';   // textContent, so the block holds pure source text
    doc.appendChild(line);
  });

  const FOOTER = D.footer || [
    { id: 'cancel', label: 'Cancel', kind: 'cancel' },
    { id: 'discuss', label: 'Discuss first', kind: 'discuss' },
    { id: 'submit', label: 'Submit review', kind: 'primary' }
  ];
  const fbar = $('footer');
  FOOTER.forEach(f => { const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn ' + (f.kind || ''); btn.textContent = f.label; btn.onclick = () => commit(f); fbar.appendChild(btn); });

  let sent = false;
  async function commit(f) {
    if (sent) return;
    sent = true;
    fbar.querySelectorAll('button').forEach(button => { button.disabled = true; });
    // annotate.js patches fetch to merge `annotations` into this body automatically.
    const payload = { nonce: NONCE, action: f.id, actionKind: f.kind || 'primary', generalNote: (D.hideGeneralNote ? '' : $('generalNote').value) };
    const ic = $('doneIc'), t = $('doneTitle'), m = $('doneMsg');
    if (f.kind === 'cancel') { ic.textContent = '✕'; ic.style.background = 'var(--surface-2)'; ic.style.color = 'var(--ink-3)'; t.textContent = 'Cancelled'; m.textContent = 'Nothing was submitted. Return to the chat.'; }
    else if (f.kind === 'discuss') { ic.textContent = '💬'; ic.style.background = 'var(--accent-soft)'; ic.style.color = 'var(--accent)'; t.textContent = 'Sent for discussion'; m.textContent = 'Your comments are back in the chat; nothing acted on until you agree.'; }
    else { t.textContent = 'Submitted'; m.textContent = 'Your comments are on their way back to the chat. You can close this tab.'; }
    try { await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); }
    catch (e) { sent = false; fbar.querySelectorAll('button').forEach(button => { button.disabled = false; }); ic.textContent = '!'; ic.style.background = 'var(--surface-2)'; t.textContent = 'Could not reach the agent'; m.textContent = 'The local server did not respond — check the chat.'; }
    $('done').classList.add('show');
  }
</script>
</body>
</html>
